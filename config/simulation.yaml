# Simulation, trim target, and guidance run configuration.

aircraft_config: "config/aircraft_b772.yaml"
wake_config: "config/wake.yaml"

# "custom" = our own RK4/rotation-matrix 6-DOF model (src/aircraft/aircraft.py)
# "jsbsim" = the validated JSBSim FDM running our generated 777-200 model
#            (src/aircraft/jsbsim_aircraft.py, jsbsim_models/aircraft/777-200)
dynamics_backend: "jsbsim"

# Only used by scripts/run_sim_flightgear.py.
# "external" (default) = our own JSBSim + Navigator/Autopilot drive the
#            flight; FlightGear just renders the puppeted 777-200 model
#            (--fdm=external, native-fdm UDP stream). This is the mode
#            everything above (dynamics_backend, guidance, autopilot_gains)
#            applies to -- don't break this one.
# "native"  = skip our sim entirely and let FlightGear fly its own
#            installed 777-200 with its own bundled FDM/autopilot instead.
#            Useful as an independent reference to compare our sim against.
flightgear:
  dynamics: "external"
  # "waypoint" (original) = Navigator: fly to guidance.target_xy_m (absolute
  #            north/east from trim start) and hold once inside arrival_radius_m.
  # "straight_offset" (default) = OffsetNavigator: fly straight along the
  #            initial heading, then move to and hold guidance.lateral_offset's
  #            (lateral, vertical) offset from that original track.
  guidance_mode: "straight_offset"

trim:
  cruise_altitude_m: 10668.0   # FL350
  target_cl: 0.5
  initial_heading_deg: 90.0    # due east, used only to build the initial DCM
  initial_position_ned_m: [0.0, 0.0, -10668.0]  # down = -altitude

integration:
  dt_s: 0.05
  # Capped to a window we've validated stays smooth and bounded on the
  # jsbsim backend -- see README's "known limitations" for the long-duration
  # (>~900s) altitude-hold droop against JSBSim's real, lightly damped
  # phugoid mode, which needs a more sophisticated autopilot to fully null.
  max_duration_s: 600.0

guidance:
  target_xy_m: [20000.0, 15000.0]     # north, east offset from trim start
  arrival_radius_m: 3000.0   # realistic for a widebody's turn radius at gentle bank angles
  max_bank_angle_rad: 0.35             # ~20 deg, keeps the turn gentle/slow
  max_climb_rate_m_s: 2.0
  heading_hold:
    kp_roll_cmd_per_heading_err: 1.4
    max_roll_rate_cmd_rad_s: 0.15
  altitude_hold:
    kp_pitch_cmd_per_alt_err: 0.05
    kd_pitch_cmd_per_climb_rate_err: 0.08
  autopilot_gains:
    roll:
      kp: 0.5
      ki: 0.0
      kd: 3.0
    pitch:
      # Inner loop: elevator (rad) per (rad pitch-attitude error) / per
      # (rad/s pitch rate). See climb_rate_to_pitch below for the outer loop.
      # Kept gentle: JSBSim's full nonlinear 777-200 has a real, lightly
      # damped phugoid mode that a fast/aggressive elevator loop resonates
      # with (our simplified custom model doesn't show this).
      kp: 0.15
      ki: 0.0
      kd: 0.3
    yaw_damper:
      kp: 1.5
    speed:
      kp: 0.01
      ki: 0.0
  # Only used when flightgear.guidance_mode == "straight_offset".
  lateral_offset:
    target_lateral_m: 800.0      # + = right of the initial track, - = left
    target_vertical_m: 0.0       # + = above cruise altitude, - = below
    # Same pure-pursuit shape as the waypoint mode's Navigator, just aimed at
    # a synthetic point this far ahead along the track (offset laterally by
    # the remaining error) instead of a fixed point -- smaller means a
    # sharper/faster correction, larger means a gentler one.
    lookahead_m: 25000.0
    arrival_tolerance_m: 50.0       # both lateral and vertical error must be under this to latch "arrived"
  climb_rate_to_pitch:
    # Outer loop: pitch-attitude offset from trim (rad) per (m/s climb-rate error).
    # Kept small: at cruise speed even a couple degrees of pitch produces a
    # large climb rate, so a bigger gain overshoots the commanded climb rate
    # badly. P-only: even a tiny ki here reawakens the aircraft's real
    # phugoid mode. The P-only droop is a known limitation -- see README.
    kp: 0.006
    ki: 0.0
    max_pitch_offset_rad: 0.1   # ~5.7 deg

logging:
  level: "INFO"
  log_file: "logs/simulation.log"
  telemetry_csv: "logs/telemetry.csv"
  telemetry_stride: 1     # log every Nth integration step
